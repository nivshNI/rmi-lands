name: RMI Tender Monitor

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:         # Manual trigger button

# Prevent overlapping runs (avoids duplicate notifications)
concurrency:
  group: rmi-monitor
  cancel-in-progress: false  # Wait for current run, skip new one

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push baseline.json updates

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore yeshuv cache (settlement names) — speeds up runs
      - uses: actions/cache/restore@v4
        with:
          path: .yeshuv_cache.json
          key: rmi-yeshuv-${{ github.ref }}

      - name: Run monitor
        id: monitor
        env:
          NOTIFY_VIA: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RMI_UCHLUSIYA: ${{ secrets.RMI_UCHLUSIYA }}
        run: python main.py

      # Baseline is in repo (baseline.json) — commit updates so next run gets it.
      # docs/index.html is regenerated by main.py on every run, so the map stays
      # in step with the snapshot the notifications were built from.
      - name: Commit and push baseline + map
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.json docs/index.html
          # The map embeds a "generated" timestamp, so it differs on every run.
          # Gate the push on the tender data itself to avoid a commit every 3h.
          if git diff --staged --quiet -- baseline.json; then
            echo "No tender changes, skip push"
            git reset
          else
            git commit -m "chore: update baseline and map"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Save yeshuv cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .yeshuv_cache.json
          key: rmi-yeshuv-${{ github.ref }}
