name: RMI Tender Monitor

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:         # Manual trigger button

# Prevent overlapping runs (avoids duplicate notifications)
concurrency:
  group: rmi-monitor
  cancel-in-progress: false  # Wait for current run, skip new one

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push baseline.json updates

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore yeshuv cache (settlement names) — speeds up runs
      - uses: actions/cache/restore@v4
        with:
          path: .yeshuv_cache.json
          key: rmi-yeshuv-${{ github.ref }}

      - name: Run monitor
        id: monitor
        env:
          NOTIFY_VIA: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RMI_UCHLUSIYA: ${{ secrets.RMI_UCHLUSIYA }}
        run: python main.py

      # Baseline is in repo (baseline.json) — checkout gets it, we commit updates
      - name: Commit and push baseline
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          git diff --staged --quiet || git commit -m "chore: update baseline"
          git push

      - name: Save yeshuv cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .yeshuv_cache.json
          key: rmi-yeshuv-${{ github.ref }}
